name: Release shared libraries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-amd64:
    name: Windows amd64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $env:CGO_ENABLED = "1"

          # v1.16.0 -> 1.16.0
          $version = "${{ github.ref_name }}".TrimStart("v")

          go build `
            -buildmode=c-shared `
            -o "dist/tls-client-windows-64-$version.dll" `
            ./cffi_dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: |
            dist/*.dll
            dist/*.h


  build-darwin-amd64:
    name: macOS amd64
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: |
          mkdir -p dist

          # v1.16.0 -> 1.16.0
          VERSION="${GITHUB_REF_NAME#v}"

          CGO_ENABLED=1 \
          go build \
            -buildmode=c-shared \
            -o "dist/tls-client-darwin-amd64-${VERSION}.dylib" \
            ./cffi_dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: darwin-amd64
          path: |
            dist/*.dylib
            dist/*.h


  build-darwin-arm64:
    name: macOS arm64
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: |
          mkdir -p dist

          # v1.16.0 -> 1.16.0
          VERSION="${GITHUB_REF_NAME#v}"

          CGO_ENABLED=1 \
          go build \
            -buildmode=c-shared \
            -o "dist/tls-client-darwin-arm64-${VERSION}.dylib" \
            ./cffi_dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64
          path: |
            dist/*.dylib
            dist/*.h


  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-windows-amd64
      - build-darwin-amd64
      - build-darwin-arm64

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List release files
        run: find release-artifacts -maxdepth 2 -type f -print

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/*.dll
            release-artifacts/*.dylib
