name: Release shared libraries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and release libraries
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Windows cross compiler
        run: brew install mingw-w64

      - name: Build libraries
        working-directory: cffi_dist
        run: |
          mkdir -p dist
          chmod +x build.sh

          VERSION="${GITHUB_REF_NAME#v}"

          echo "Building version ${VERSION}"

          # build.sh also attempts Linux/Docker/xgo builds.
          # We only care about Darwin amd64/arm64 and Windows x64.
          ./build.sh "${VERSION}" || true

      - name: Verify required libraries
        working-directory: cffi_dist
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          test -f "dist/tls-client-darwin-amd64-${VERSION}.dylib"
          test -f "dist/tls-client-darwin-arm64-${VERSION}.dylib"
          test -f "dist/tls-client-windows-64-${VERSION}.dll"

          echo "All required libraries were built successfully."

      - name: List artifacts
        working-directory: cffi_dist
        run: ls -lah dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            cffi_dist/dist/tls-client-darwin-amd64-*.dylib
            cffi_dist/dist/tls-client-darwin-arm64-*.dylib
            cffi_dist/dist/tls-client-windows-64-*.dll
